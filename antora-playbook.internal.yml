site:
  title: XPO Docs
  url: https://docs.xpo.at
  start_page: xpo::index.adoc
  keys:
    comentario_url: https://comments.xpo.at
git:
  # Coolify injects GIT_CREDENTIALS=https://x-access-token:<token>@github.com (read-only fine-grained token).
  credentials: { path: ./.git-credentials }
content:
  sources:
    - { url: https://github.com/tradmangh/at-xpo-x.git,               start_path: docs, branches: [main, dev] }
    - { url: https://github.com/tradmangh/xpo-ops.git,                start_path: docs, branches: [main, dev] }
    - { url: https://github.com/tradmangh/omnion-swe.git,             start_path: docs, branches: [main, dev] }
    - { url: https://github.com/tradmangh/windy-api-client.git,       start_path: docs, branches: main }
    - { url: https://github.com/tradmangh/at-xpo-windy-mcpserver.git, start_path: docs, branches: main }
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./ui
output: { dir: ./build/internal }
runtime:
  fetch: true
  log: { failure_level: warn }
